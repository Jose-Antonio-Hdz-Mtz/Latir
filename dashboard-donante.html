<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LATIR — Mi Dashboard de Donante</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { background: var(--cream); padding-top: 80px; font-family: 'DM Sans', sans-serif; }

    .dash-container { max-width: 1100px; margin: 0 auto; padding: 40px 20px 60px; }

    /* Welcome Header */
    .dash-welcome {
      background: linear-gradient(135deg, #3d1f0d 0%, #c0522a 60%, #d4a24c 100%);
      border-radius: 20px;
      padding: 36px 40px;
      color: #fff;
      margin-bottom: 32px;
      position: relative;
      overflow: hidden;
    }
    .dash-welcome::before {
      content: '♡';
      position: absolute; right: 40px; top: 50%; transform: translateY(-50%);
      font-size: 8rem; opacity: 0.08; line-height: 1;
    }
    .dash-welcome h1 {
      font-family: 'Playfair Display', serif;
      font-size: 1.8rem; font-weight: 700;
      margin: 0 0 6px 0;
    }
    .dash-welcome p { opacity: 0.85; margin: 0; font-size: 0.92rem; }

    /* Stats Row */
    .dash-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-bottom: 32px;
    }
    @media (max-width: 640px) { .dash-stats { grid-template-columns: 1fr; } }
    .stat-card {
      background: rgba(255,255,255,0.8);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,0.5);
      border-radius: 16px;
      padding: 24px 28px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.06);
    }
    .stat-card-label { font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: #64748b; margin-bottom: 8px; }
    .stat-card-value { font-size: 2rem; font-weight: 700; color: var(--brown-dark, #2c1a0e); line-height: 1; }
    .stat-card-value span { font-size: 1rem; font-weight: 500; color: #64748b; }

    /* Section */
    .dash-section-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.3rem; font-weight: 700;
      color: var(--brown-dark, #2c1a0e);
      margin: 0 0 20px 0;
      display: flex; align-items: center; gap: 10px;
    }

    /* Donation Cards */
    .donaciones-grid { display: flex; flex-direction: column; gap: 16px; }

    .don-card {
      background: rgba(255,255,255,0.85);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,0.5);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.06);
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 20px;
      align-items: center;
      transition: box-shadow 0.2s, transform 0.2s;
    }
    .don-card:hover { box-shadow: 0 8px 32px rgba(0,0,0,0.1); transform: translateY(-1px); }

    .don-avatar {
      width: 52px; height: 52px;
      background: linear-gradient(135deg, #fdeaea, #fbbf7a);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.4rem; flex-shrink: 0;
    }

    .don-info h4 { margin: 0 0 3px 0; font-size: 1rem; font-weight: 700; color: #1e293b; }
    .don-info p  { margin: 0 0 8px 0; font-size: 0.8rem; color: #64748b; }

    .don-progress-wrap { margin-top: 6px; }
    .don-progress-label { display: flex; justify-content: space-between; font-size: 0.72rem; color: #94a3b8; margin-bottom: 4px; }
    .don-progress-bar { height: 6px; background: #f1f5f9; border-radius: 50px; overflow: hidden; }
    .don-progress-fill { height: 100%; border-radius: 50px; background: linear-gradient(90deg, #c0522a, #d4a24c); transition: width 1s ease; }

    .don-meta { text-align: right; flex-shrink: 0; }
    .don-monto { font-size: 1.3rem; font-weight: 700; color: var(--terracota, #c0522a); }
    .don-fecha { font-size: 0.75rem; color: #94a3b8; margin-top: 4px; }

    .ig-badge-sm {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 50px;
      font-size: 0.7rem;
      font-weight: 700;
      margin-right: 6px;
    }
    .ig-bajo    { background: rgba(120,180,120,0.15); color: #4a8a4a; }
    .ig-medio   { background: rgba(212,162,76,0.15);  color: #b8882a; }
    .ig-urgente { background: rgba(230,120,50,0.15);  color: #c0522a; }
    .ig-critico { background: rgba(200,50,50,0.15);   color: #b91c1c; }

    .estado-badge {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 50px;
      font-size: 0.7rem;
      font-weight: 700;
    }
    .estado-activo   { background: rgba(42,157,143,0.12); color: #2A9D8F; }
    .estado-pendiente { background: rgba(212,162,76,0.12); color: #b8882a; }
    .estado-general  { background: rgba(100,116,139,0.12); color: #475569; }

    /* Empty State */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      background: rgba(255,255,255,0.6);
      border-radius: 16px;
      border: 1px dashed #e2e8f0;
    }
    .empty-state .empty-icon { font-size: 3rem; margin-bottom: 12px; }
    .empty-state h3 { color: var(--brown-dark, #2c1a0e); margin: 0 0 8px; font-family: 'Playfair Display', serif; }
    .empty-state p  { color: #64748b; margin: 0 0 20px; font-size: 0.88rem; }

    /* Btn */
    .btn-donar-now {
      background: linear-gradient(135deg, var(--terracota, #c0522a), #e07040);
      color: #fff;
      border: none;
      border-radius: 50px;
      padding: 12px 28px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.25s;
      text-decoration: none;
      display: inline-block;
    }
    .btn-donar-now:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(192,82,42,0.35); }
  </style>
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar scrolled">
    <a href="Interfaz latir.html" class="nav-logo" style="text-decoration: none;">
      <img src="logo.png" alt="LATIR Logo" style="height: 44px; width: auto; mix-blend-mode: multiply;" />
      <span class="logo-text" id="navNombre" style="margin-left: 8px;"></span>
    </a>
    <ul class="nav-links">
      <li><a href="Interfaz latir.html">Ver Pacientes</a></li>
      <li><a href="Interfaz latir.html" id="navDonarBtn" style="color:var(--terracota);font-weight:700;">+ Hacer donación</a></li>
      <li><button onclick="cerrarSesionDonante()" class="btn-primary" style="padding: 6px 16px; background:var(--terracota);">Cerrar Sesión</button></li>
    </ul>
  </nav>

  <div class="dash-container">

    <!-- Welcome -->
    <div class="dash-welcome">
      <h1>¡Hola, <span id="welcomeName">Donante</span>! 👋</h1>
      <p>Aquí puedes ver el impacto real de tu generosidad en cada paciente que has apoyado.</p>
    </div>

    <!-- Stats -->
    <div class="dash-stats">
      <div class="stat-card">
        <div class="stat-card-label">💰 Total donado</div>
        <div class="stat-card-value" id="statTotal">$0 <span>MXN</span></div>
      </div>
      <div class="stat-card">
        <div class="stat-card-label">🎁 Donaciones realizadas</div>
        <div class="stat-card-value" id="statCount">0 <span>veces</span></div>
      </div>
      <div class="stat-card">
        <div class="stat-card-label">🏥 Pacientes apoyados</div>
        <div class="stat-card-value" id="statPacientes">0 <span>pacientes</span></div>
      </div>
    </div>

    <!-- Historial -->
    <h2 class="dash-section-title">📋 Mis Donaciones y Seguimiento</h2>

    <div id="donacionesContainer" class="donaciones-grid">
      <p style="text-align:center;color:#94a3b8;padding:30px;">⏳ Cargando tu historial...</p>
    </div>

  </div>

  <script src="latir-session.js"></script>
  <script>
    // ── GUARDIA DE SESIÓN ──
    const donante = LATIR_SESSION.proteger('donante');
    if (!donante) {
      document.body.style.display = 'none';
      throw new Error("Redirigiendo a inicio de sesión...");
    }

    // Llenar datos del nav y welcome
    document.getElementById('welcomeName').textContent = (donante.nombre || '').split(' ')[0];
    document.getElementById('navNombre').textContent   = 'Mi Cuenta';

    window.cerrarSesionDonante = () => {
      LATIR_SESSION.limpiarTodo();
      window.location.href = 'Interfaz latir.html';
    };

    function igClase(ig) {
      if (!ig || ig <= 2) return 'ig-bajo';
      if (ig <= 4) return 'ig-medio';
      if (ig <= 6) return 'ig-urgente';
      return 'ig-critico';
    }
    function igTexto(ig) {
      if (!ig) return '—';
      if (ig <= 2) return 'Seguimiento';
      if (ig <= 4) return 'Moderado';
      if (ig <= 6) return 'Urgente';
      if (ig <= 8) return 'Crítico';
      return 'Emergencia';
    }
    function pct(r, m) { if (!m) return 0; return Math.min(100, Math.round((r / m) * 100)); }
    function money(n) { return '$' + Number(n || 0).toLocaleString('es-MX', { minimumFractionDigits: 0 }); }

    // ── CARGAR DONACIONES ──
    async function cargarDonaciones() {
      const cont = document.getElementById('donacionesContainer');
      try {
        const res = await fetch(`/donantes/${donante.id}/donaciones`);
        if (!res.ok) throw new Error();
        const data = await res.json();

        // Calcular stats
        let total = 0, pacientesSet = new Set();
        data.forEach(d => {
          total += Number(d.Monto || 0);
          if (d.pacienteId) pacientesSet.add(d.pacienteId);
        });

        document.getElementById('statTotal').innerHTML   = money(total) + ' <span>MXN</span>';
        document.getElementById('statCount').innerHTML   = data.length + ' <span>veces</span>';
        document.getElementById('statPacientes').innerHTML = pacientesSet.size + ' <span>pacientes</span>';

        if (data.length === 0) {
          cont.innerHTML = `
            <div class="empty-state">
              <div class="empty-icon">💝</div>
              <h3>Aún no has hecho ninguna donación</h3>
              <p>Elige un paciente del portal y realiza tu primera aportación. ¡Tu apoyo puede cambiar una vida!</p>
              <a href="Interfaz latir.html" class="btn-donar-now">Ver pacientes y donar →</a>
            </div>`;
          return;
        }

        cont.innerHTML = '';
        data.forEach(d => {
          const esFondoGeneral = !d.pacienteId;
          const porcentaje     = pct(d.recaudado, d.meta);
          const igClass        = igClase(d.ig);
          const estadoBadge    = esFondoGeneral
            ? '<span class="estado-badge estado-general">Fondo General</span>'
            : (d.estadoPaciente === 'Activo'
                ? '<span class="estado-badge estado-activo">✓ Publicado</span>'
                : '<span class="estado-badge estado-pendiente">En revisión</span>');

          const card = document.createElement('div');
          card.className = 'don-card';
          card.innerHTML = `
            <div class="don-avatar">${esFondoGeneral ? '🏥' : (d.ig >= 7 ? '🚨' : '💊')}</div>
            <div class="don-info">
              <h4>${esFondoGeneral ? 'Fondo General LATIR' : (d.pacienteNombre || 'Paciente')}</h4>
              <p>
                ${esFondoGeneral ? '' : `<span class="ig-badge-sm ${igClass}">IG ${d.ig} · ${igTexto(d.ig)}</span>`}
                ${estadoBadge}
                ${d.diagnostico ? `<br><span style="font-size:0.78rem;color:#94a3b8;">${d.diagnostico}</span>` : ''}
              </p>
              ${!esFondoGeneral && d.meta > 0 ? `
              <div class="don-progress-wrap">
                <div class="don-progress-label">
                  <span>${money(d.recaudado)} recaudados</span>
                  <span>${porcentaje}% de ${money(d.meta)}</span>
                </div>
                <div class="don-progress-bar">
                  <div class="don-progress-fill" style="width:0%" data-w="${porcentaje}%"></div>
                </div>
              </div>
              ` : ''}
            </div>
            <div class="don-meta">
              <div class="don-monto">${money(d.Monto)}</div>
              <div class="don-fecha">Donado el<br>${d.fechaDonacion || '—'}</div>
            </div>
          `;
          cont.appendChild(card);

          // Animar barra
          setTimeout(() => {
            const fill = card.querySelector('.don-progress-fill');
            if (fill) fill.style.width = fill.dataset.w;
          }, 150);
        });

      } catch (err) {
        cont.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">⚠️</div>
            <h3>No se pudo cargar el historial</h3>
            <p>Verifica que el servidor esté corriendo y vuelve a intentarlo.</p>
          </div>`;
      }
    }

    cargarDonaciones();
  </script>
</body>
</html>
